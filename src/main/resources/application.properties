# =====================================================================
# Smart Power On S.A.C. - Configuración de la aplicación
# =====================================================================

server.port=8080
spring.application.name=smart-power-on

# --- Base de datos ---
# Por defecto: MySQL 8 de producción (sección 7.3 del informe).
# Para pruebas sin MySQL, active el perfil h2:
#   mvn spring-boot:run -Dspring.profiles.active=h2
#   (configuración en application-h2.properties)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/smart_power_on_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456789}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# En MySQL el esquema se crea o migra manualmente; nunca borrar datos al iniciar.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/data.sql

# --- Thymeleaf ---
spring.thymeleaf.cache=false

# --- Encoding UTF-8 (RNF14: todo en español, mensajes con acentos) ---
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# --- JWT (RF01, RNF03) ---
app.jwt.secreto=smart-power-on-clave-secreta-HS256-muy-larga-para-firmar-tokens-2026
app.jwt.expiracion-minutos=480
app.jwt.inactividad-minutos=30

# --- Aplicación ---
app.empresa.nombre=Smart Power On S.A.C.
app.empresa.ruc=20606120860
app.empresa.direccion=Calle Manuel Villarán N.° 367, Comas, Lima

logging.level.org.hibernate.SQL=warn
logging.level.com.smartpoweron=info

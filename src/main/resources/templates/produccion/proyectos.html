<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security6">
<head th:replace="~{fragments/layout :: head('Proyectos de tablero')}"></head>
<body>
<div class="layout">
  <div class="w-100">
    <div th:replace="~{fragments/layout :: topbar}"></div>
    <div class="d-flex">
      <div th:replace="~{fragments/layout :: menu}"></div>
      <main class="content">
        <h3 class="mb-1">Proyectos de tablero</h3>
        <p class="text-muted small mb-3">P2-T02 · RF12</p>
        <div class="card">
          <div class="card-body">
            <div id="contenido"></div>
          </div>
        </div>
      </main>
    </div>
  </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
<script>
(async () => {
  try {
    const datos = await getJson('/api/produccion/proyectos');
    const proyectosPorId = new Map(datos.map(p => [p.idProyecto, p]));
    el('contenido').innerHTML = `
    <button class="btn btn-primary mb-3" id="btnNuevo">Nuevo proyecto</button>
    <table class="table table-sm"><thead><tr><th>Código</th><th>Cliente</th><th>Inicio</th><th>Presupuesto</th><th>Estado</th><th>Acciones</th></tr></thead>
    <tbody>${datos.map(p=>`<tr><td>${esc(p.codigo)}</td><td>${esc(p.cliente)}</td><td>${p.fechaInicio||''}</td><td>${fmtMonto(p.presupuesto)}</td><td>${esc(p.estado)}</td><td>${p.estado==='ANULADO'?'':`<button class="btn btn-sm btn-outline-primary me-1" onclick="editarProyecto(${p.idProyecto})">Editar</button><button class="btn btn-sm btn-outline-danger" onclick="anularProyecto(${p.idProyecto})">Anular</button>`}</td></tr>`).join('')}</tbody></table>
    <div id="form" class="card p-3" style="display:none">
      <h6 id="tituloFormulario">Nuevo proyecto</h6>
      <div class="row g-2">
        <div class="col"><input class="form-control" id="codigo" placeholder="Código"/></div>
        <div class="col"><input class="form-control" id="cliente" placeholder="Cliente"/></div>
        <div class="col"><input type="date" class="form-control" id="inicio"/></div>
        <div class="col"><input type="number" step="0.01" class="form-control" id="presupuesto" placeholder="Presupuesto"/></div>
      </div>
      <button class="btn btn-primary mt-2" id="guardar">Guardar</button>
      <button class="btn btn-outline-secondary mt-2" id="cancelar" type="button">Cancelar</button>
    </div>`;
  let proyectoEditando = null;
  document.getElementById('btnNuevo').onclick = () => {
    proyectoEditando = null;
    el('tituloFormulario').textContent = 'Nuevo proyecto';
    el('codigo').value = '';
    el('cliente').value = '';
    el('inicio').value = '';
    el('presupuesto').value = '';
    el('form').style.display = 'block';
  };
  document.getElementById('cancelar').onclick = () => el('form').style.display = 'none';
  window.editarProyecto = id => {
    const p = proyectosPorId.get(id);
    if (!p) return;
    proyectoEditando = id;
    el('tituloFormulario').textContent = 'Editar proyecto';
    el('codigo').value = p.codigo;
    el('cliente').value = p.cliente;
    el('inicio').value = p.fechaInicio || '';
    el('presupuesto').value = p.presupuesto;
    el('form').style.display = 'block';
  };
  window.anularProyecto = async id => {
    if (!confirm('¿Anular este proyecto? Se conservará en el historial.')) return;
    try { await api('/api/produccion/proyectos/' + id, {method:'DELETE'}); window.location.reload(); }
    catch(e) { alert(e.message); }
  };
  document.getElementById('guardar').onclick = async () => {
    try {
      const datosProyecto = {codigo:el('codigo').value, cliente:el('cliente').value, fechaInicio:el('inicio').value, presupuesto: parseFloat(el('presupuesto').value)};
      if (proyectoEditando == null) await postJson('/api/produccion/proyectos', datosProyecto);
      else await putJson('/api/produccion/proyectos/' + proyectoEditando, datosProyecto);
      window.location.reload();
    } catch(e){ alert(e.message); }
  };
  } catch(e) { el('contenido').innerHTML = '<div class="alert alert-danger">' + e.message + '</div>'; }
})();
</script>
</body></html>

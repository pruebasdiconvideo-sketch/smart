<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security6">
<head th:replace="~{fragments/layout :: head('Ingreso de materiales contra orden de compra')}"></head>
<body>
<div class="layout">
  <div class="w-100">
    <div th:replace="~{fragments/layout :: topbar}"></div>
    <div class="d-flex">
      <div th:replace="~{fragments/layout :: menu}"></div>
      <main class="content">
        <h3 class="mb-1">Ingreso de materiales contra orden de compra</h3>
        <p class="text-muted small mb-3">Registre órdenes de compra con uno o varios materiales de varias categorías, vincule el proveedor registrado y registre los ingresos contra la OC.</p>
        <div class="card">
          <div class="card-body">
            <div id="contenido"></div>
          </div>
        </div>
      </main>
    </div>
  </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
<script>
(async () => {
  try {
    const [ordenes, proveedores, materiales] = await Promise.all([
      getJson('/api/almacen/ordenes-compra?incluirCerradas=true'),
      getJson('/api/empresa?tipo=PROVEEDOR'),
      getJson('/api/almacen/materiales')
    ]);
    const ocs = ordenes.filter(o => o.estado === 'ABIERTA');
    const matOpts = materiales.map(m => '<option value="' + m.idMaterial + '">' + esc(m.codigo) + ' · ' + esc(m.nombre) + ' (' + esc(m.categoria||'—') + ')</option>').join('');

  el('contenido').innerHTML =
    '<h5>Órdenes de compra</h5>' +
    '<button class="btn btn-primary btn-sm mb-2" id="nuevaOrden">Nueva orden</button>' +
    '<div class="table-responsive"><table class="table table-sm align-middle">' +
      '<thead><tr><th>Código</th><th>Proveedor</th><th>RUC</th><th>Fecha</th><th>Ítems</th><th>Estado</th><th>Acciones</th></tr></thead>' +
      '<tbody id="tablaOcs"></tbody></table></div>' +
    '<div id="formOrden" class="card p-3 mb-4" style="display:none">' +
      '<h6 id="tituloOrden">Nueva orden de compra</h6>' +
      '<div class="row g-2">' +
        '<div class="col-md-3"><label class="form-label small">Código</label><input class="form-control" id="codigoOrden" placeholder="OC-2026-XXX" required/></div>' +
        '<div class="col-md-6"><label class="form-label small">Proveedor (registrado)</label>' + modalSelectorMarkup('proveedorSel', 'Buscar y seleccionar proveedor') + '</div>' +
        '<div class="col-md-3"><label class="form-label small">Fecha de emisión</label><input class="form-control" id="fechaOrden" type="date" required/></div>' +
      '</div>' +
      '<div class="mt-2 small"><a href="/empresa/proveedores" target="_blank">¿No encuentra el proveedor? Regístrelo aquí.</a></div>' +
      '<h6 class="mt-3">Materiales de la orden <small class="text-muted">(una OC puede tener varios materiales de varias categorías)</small></h6>' +
      '<table class="table table-sm"><thead><tr><th>Material</th><th>Categoría</th><th>Cantidad</th><th>Precio unit.</th><th></th></tr></thead>' +
        '<tbody id="itemsOrden"></tbody></table>' +
      '<button class="btn btn-secondary btn-sm mb-2" id="addItemOrden">Agregar material</button>' +
      '<div><button class="btn btn-primary btn-sm" id="guardarOrden">Guardar orden</button>' +
        '<button class="btn btn-secondary btn-sm" id="cancelarOrden" type="button">Cancelar</button></div>' +
    '</div>' +
    '<hr/>' +
    '<div class="mb-3"><label class="form-label">Orden de compra (sólo ABIERTAS)</label>' +
      modalSelectorMarkup('idOC', 'Buscar y seleccionar orden de compra') + '</div>' +
    '<h6>Ítems recibidos <small class="text-muted">— seleccione el modelo del catálogo y registre un número de serie por cada unidad</small></h6>' +
    '<table class="table table-sm"><thead><tr><th>Modelo (catálogo)</th><th>N.° de serie (uno por línea = una unidad)</th><th>Cantidad (sin series)</th><th></th></tr></thead>' +
      '<tbody id="items">' + filaIngreso() + '</tbody></table>' +
    '<button class="btn btn-secondary btn-sm" id="add">Agregar ítem</button>' +
    '<button class="btn btn-primary" id="guardar">Registrar ingreso</button>' +
    '<div id="res" class="mt-3"></div>';

  initModalSelector('idOC', 'orden de compra', ocs.map(function(o){ return {value:o.idOrdenCompra, label:o.codigo + ' - ' + o.proveedor}; }));
  initModalSelector('proveedorSel', 'proveedor', proveedores.map(function(p){ return {value:p.idEmpresa, label:p.razonSocial + ' — RUC ' + p.ruc, meta:p.contactoNombre ? ('Contacto: ' + p.contactoNombre) : null}; }));

  function renderOcs() {
    el('tablaOcs').innerHTML = ordenes.map(function(o){
      var itemsCell = (o.items && o.items.length)
        ? '<button class="btn btn-sm btn-link p-0" onclick="verItems(' + o.idOrdenCompra + ')">' + o.items.length + ' material(es)</button>'
        : '<span class="text-muted">0</span>';
      var estado = o.estado === 'ABIERTA' ? '<span class="badge bg-success">Abierta</span>' : '<span class="badge bg-secondary">Cerrada</span>';
      var acciones = o.estado === 'ABIERTA'
        ? '<button class="btn btn-sm btn-outline-primary me-1" onclick="editarOrden(' + o.idOrdenCompra + ')">Editar</button><button class="btn btn-sm btn-outline-danger" onclick="cerrarOrden(' + o.idOrdenCompra + ')">Cerrar</button>'
        : '<button class="btn btn-sm btn-outline-success" onclick="reabrirOrden(' + o.idOrdenCompra + ')">Reabrir</button>';
      var itemsDetalle = (o.items && o.items.length)
        ? '<table class="table table-sm mb-0"><thead><tr><th>Código</th><th>Material</th><th>Categoría</th><th>Cantidad</th><th>Precio</th><th>Subtotal</th></tr></thead><tbody>' +
          o.items.map(function(it){
            return '<tr><td>' + esc(it.codigoMaterial||'—') + '</td><td>' + esc(it.nombreMaterial||'—') + '</td><td>' + esc(it.categoria||'—') + '</td><td>' + it.cantidad + '</td><td>S/ ' + fmtMonto(it.precioUnitario) + '</td><td>S/ ' + fmtMonto((it.precioUnitario||0)*it.cantidad) + '</td></tr>';
          }).join('') + '</tbody></table>'
        : '<p class="text-muted mb-0">Sin materiales</p>';
      return '<tr>' +
        '<td><strong>' + esc(o.codigo) + '</strong></td>' +
        '<td>' + esc(o.proveedor) + '</td>' +
        '<td>' + esc(o.rucProveedor||'—') + '</td>' +
        '<td>' + esc(o.fechaEmision) + '</td>' +
        '<td>' + itemsCell + '</td>' +
        '<td>' + estado + '</td>' +
        '<td>' + acciones + '</td>' +
      '</tr>' +
      '<tr id="items-' + o.idOrdenCompra + '" style="display:none"><td colspan="7" class="bg-light px-3">' + itemsDetalle + '</td></tr>';
    }).join('');
  }
  renderOcs();
  window.verItems = function(id){ var r = el('items-'+id); r.style.display = r.style.display==='none'?'table-row':'none'; };

  // Fila del formulario de INGRESO: selecciona modelo del catálogo + series por unidad
  function filaIngreso() {
    return '<tr>' +
      '<td><select class="form-select form-select-sm matIng"><option value="">— Seleccione modelo —</option>' + matOpts + '</select></td>' +
      '<td><textarea class="form-control form-control-sm seriesIng" rows="2" placeholder="SN-001&#10;SN-002&#10;..."></textarea></td>' +
      '<td><input type="number" class="form-control form-control-sm canIng" min="1" placeholder="opcional"/></td>' +
      '<td><button class="btn btn-sm btn-link text-danger" onclick="this.parentElement.parentElement.remove()">Quitar</button></td>' +
    '</tr>';
  }

  var ordenEditando = null;
  var itemN = 0;
  function filaItemOrden() {
    var id = itemN++;
    return '<tr data-item="' + id + '">' +
      '<td><select class="form-select form-select-sm matSel"><option value="">— Seleccione —</option>' + matOpts + '</select></td>' +
      '<td class="catCell"></td>' +
      '<td><input type="number" class="form-control form-control-sm canItem" min="1"/></td>' +
      '<td><input type="number" class="form-control form-control-sm preItem" min="0" step="0.01"/></td>' +
      '<td><button class="btn btn-sm btn-link text-danger" onclick="this.parentElement.parentElement.remove()">Quitar</button></td>' +
    '</tr>';
  }
  function abrirOrden(orden) {
    ordenEditando = orden ? orden.idOrdenCompra : null;
    el('tituloOrden').textContent = orden ? 'Editar orden de compra' : 'Nueva orden de compra';
    el('codigoOrden').value = orden ? orden.codigo : '';
    el('proveedorSel').value = orden && orden.idEmpresa ? orden.idEmpresa : '';
    el('proveedorSelDisplay').value = orden ? (orden.proveedor + (orden.rucProveedor ? ' — RUC ' + orden.rucProveedor : '')) : '';
    el('fechaOrden').value = orden ? orden.fechaEmision : new Date().toISOString().slice(0, 10);
    el('itemsOrden').innerHTML = '';
    itemN = 0;
    if (orden && orden.items && orden.items.length) {
      orden.items.forEach(function(it){
        el('itemsOrden').insertAdjacentHTML('beforeend', filaItemOrden());
        var last = el('itemsOrden').lastElementChild;
        last.querySelector('.matSel').value = it.idMaterial;
        last.querySelector('.canItem').value = it.cantidad;
        last.querySelector('.preItem').value = it.precioUnitario || '';
        last.querySelector('.catCell').textContent = it.categoria || '';
      });
    } else {
      el('itemsOrden').insertAdjacentHTML('beforeend', filaItemOrden());
    }
    el('formOrden').style.display = 'block';
    el('formOrden').scrollIntoView({behavior: 'smooth', block: 'start'});
  }
  el('nuevaOrden').onclick = function(){ abrirOrden(null); };
  el('cancelarOrden').onclick = function(){ el('formOrden').style.display = 'none'; };
  el('addItemOrden').onclick = function(){ el('itemsOrden').insertAdjacentHTML('beforeend', filaItemOrden()); };
  el('itemsOrden').addEventListener('change', function(e){
    if (e.target.classList.contains('matSel')) {
      var m = materiales.find(function(x){ return x.idMaterial == e.target.value; });
      e.target.closest('tr').querySelector('.catCell').textContent = m ? (m.categoria||'') : '';
    }
  });
  el('guardarOrden').onclick = async function(){
    var idEmp = el('proveedorSel').value;
    var items = [];
    el('itemsOrden').querySelectorAll('tr[data-item]').forEach(function(tr){
      var idMat = tr.querySelector('.matSel').value;
      var can = tr.querySelector('.canItem').value;
      var pre = tr.querySelector('.preItem').value;
      if (idMat && can) items.push({idMaterial: parseInt(idMat), cantidad: parseInt(can), precioUnitario: pre ? parseFloat(pre) : null});
    });
    var body = {
      codigo: el('codigoOrden').value.trim(),
      idEmpresa: idEmp ? parseInt(idEmp) : null,
      fechaEmision: el('fechaOrden').value,
      items: items
    };
    try {
      if (ordenEditando === null) await postJson('/api/almacen/ordenes-compra', body);
      else await putJson('/api/almacen/ordenes-compra/' + ordenEditando, body);
      window.location.reload();
    } catch (e) { alert(e.message); }
  };
  window.editarOrden = function(id){ var orden = ordenes.find(function(o){ return o.idOrdenCompra === id; }); if (orden) abrirOrden(orden); };
  window.cerrarOrden = async function(id){
    if (!confirm('¿Cerrar esta orden? Ya no se podrá registrar nuevos ingresos asociados.')) return;
    try { await api('/api/almacen/ordenes-compra/' + id, {method: 'DELETE'}); window.location.reload(); }
    catch (e) { alert(e.message); }
  };
  window.reabrirOrden = async function(id){
    try { await patch('/api/almacen/ordenes-compra/' + id + '/reabrir'); window.location.reload(); }
    catch (e) { alert(e.message); }
  };
  el('add').onclick = function(){
    el('items').insertAdjacentHTML('beforeend', filaIngreso());
  };
  el('guardar').onclick = async function(){
    var items = [];
    var sinModelo = 0;
    document.querySelectorAll('#items tr').forEach(function(tr){
      var sel = tr.querySelector('.matIng');
      var idMat = sel ? sel.value : '';
      var m = idMat ? materiales.find(function(x){ return x.idMaterial == idMat; }) : null;
      if (!m) { sinModelo++; return; }
      var seriesRaw = (tr.querySelector('.seriesIng').value) || '';
      var series = seriesRaw.split('\n').map(function(s){ return s.trim(); }).filter(function(s){ return s.length > 0; });
      var can = tr.querySelector('.canIng').value;
      if (series.length > 0) items.push({codigo: m.codigo, numeroSeries: series});
      else if (can) items.push({codigo: m.codigo, cantidad: parseInt(can)});
    });
    if (items.length === 0) { alert('Seleccione al menos un modelo y registre su número de serie (o cantidad).'); return; }
    try {
      var r = await postJson('/api/almacen/ingresos', {idOrdenCompra: parseInt(el('idOC').value), items: items});
      el('res').innerHTML = '<div class="alert ' + (r.exito?'alert-success':'alert-warning') + '"><strong>' + esc(r.mensaje) + '</strong><ul class="mb-0 mt-2">' + (r.detalle||[]).map(function(d){return '<li>'+esc(d)+'</li>';}).join('') + '</ul>' + ((r.materialesNoRegistrados||[]).length?'<div class="mt-2">Materiales no registrados: ' + r.materialesNoRegistrados.map(esc).join(', ') + ' (regístrelos en el catálogo).</div>':'') + '</div>';
    } catch(e){ el('res').innerHTML = '<div class="alert alert-danger">' + e.message + '</div>'; }
  };
  } catch(e) { el('contenido').innerHTML = '<div class="alert alert-danger">' + e.message + '</div>'; }
})();
</script>
</body></html>
